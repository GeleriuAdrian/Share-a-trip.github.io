<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="../img/logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Lemon&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../style.css" />
        <title>SHARE A TRIP</title>
        <script
            type="module"
            src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script
            nomodule=""
            src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.js"
        ></script>
        <script type="module" src="../security.js"></script>
    </head>
    <body>
        <header class="header">
            <div class="logo-box">
                <img src="../img/logo.webp" alt="logo" class="logo-h" />
                <h3 class="header-name">Share a trip</h3>
            </div>
            <nav class="header-nav">
                <ul class="header-list">
                    <li class="header-li">
                        <a href="trips.html" class="header-link">trips</a>
                    </li>
                    <li class="header-li">
                        <a href="profile.html" class="header-link">profile</a>
                    </li>
                    <li class="header-li">
                        <a
                            href="contact.html"
                            class="header-link header-link-active"
                            >contact</a
                        >
                    </li>
                </ul>
            </nav>
        </header>
        <section class="contact-page">
            <div class="contact-container">
                <h2 class="contact-form-title">Contact Us</h2>
                <form
                    class="contact-form"
                    action="../includes/contact.inc.php"
                    method="POST"
                >
                    <input
                        class="form-input"
                        type="text"
                        placeholder="Name"
                        name="name"
                        required="required"
                    />
                    <input
                        class="form-input"
                        type="email"
                        placeholder="Email"
                        name="email"
                        required="required"
                    />
                    <input
                        class="form-input"
                        type="tel"
                        placeholder="Phone Number"
                        name="tel"
                        required="required"
                    />
                    <textarea
                        class="form-textarea"
                        maxlength="420"
                        rows="3"
                        placeholder="Message"
                        name="msg"
                        required="required"
                    ></textarea>
                    <button class="contact-btn">Submit</button>
                </form>
            </div>
        </section>
    </body>
</html>
